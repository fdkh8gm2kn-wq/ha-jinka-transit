configuration:
  jinka_email:
    name: Email Jinka
    description: Adresse de ton compte Jinka (sert aussi à la connexion automatique par code email).
  jinka_password:
    name: Mot de passe Jinka
  jinka_token:
    name: Jeton Jinka
    description: Valeur du cookie LA_API_TOKEN sur jinka.fr (comptes Google/Apple/code email). Voir la doc.
  mail_password:
    name: Clé d'application Google (boîte mail dédiée)
    description: >-
      Code de 16 lettres créé sur myaccount.google.com/apppasswords pour l'adresse Gmail ci-dessus.
      L'add-on s'en sert pour lire lui-même le code Jinka et se connecter tout seul.
      Autre fournisseur que Gmail : mets ici le mot de passe (ou la clé d'application) de la boîte.
  mail_user:
    name: Identifiant IMAP (optionnel)
    description: Vide = l'email Jinka.
  mail_imap_server:
    name: Serveur IMAP (optionnel)
    description: Vide = deviné d'après l'adresse (Gmail, GMX, laposte.net, Orange, Free, iCloud…).
  jinka_alerts:
    name: Alertes à surveiller
    description: Noms ou identifiants de tes alertes Jinka (= les secteurs). Vide = toutes.
  prim_api_key:
    name: Clé API PRIM (IDFM)
    description: Clé gratuite sur prim.iledefrance-mobilites.fr, utilisée pour calculer les trajets.
  destinations:
    name: Adresses (jusqu'à 5)
    description: >-
      Bureau, école, gare… Chacune avec son temps max porte-à-porte et son heure d'arrivée (jour ouvré).
      info_only = true : trajet affiché dans le message pour info, sans servir de filtre.
  allowed_modes:
    name: Modes autorisés
    description: Le bus est toujours exclu.
  min_area:
    name: Surface minimum (m²)
    description: 0 = pas de minimum. Les annonces sans surface indiquée sont gardées.
  furnished_only:
    name: Meublé uniquement (Bien'ici)
  bienici:
    name: Chercher aussi sur Bien'ici
    description: Mêmes critères que les alertes Jinka ; les doublons Jinka/Bien'ici sont écartés.
  bienici_communes:
    name: Communes Bien'ici (optionnel)
    description: Vide = les 112 communes des 3 alertes Jinka (≤ 75 min).
  max_rent:
    name: Loyer max (€, charges comprises selon l'annonce)
    description: 0 = pas de limite. Vérifié avant le calcul des trajets.
  max_walk_home_minutes:
    name: Marche max logement → station (min)
    description: Une annonce n'est retenue que si une station de métro/RER/tram est à moins de ce temps à pied du logement.
  max_walk_minutes:
    name: Trajet tout à pied accepté jusqu'à (min)
    description: >-
      Si la destination est à moins de ce temps à pied, le trajet sans transport est accepté. La marche finale
      station → destination n'est pas limitée (seule la durée totale compte).
  email_to:
    name: Envoyer les annonces par email à
    description: >-
      Ton adresse (plusieurs possibles, séparées par des virgules). L'email part de la boîte Gmail dédiée,
      avec la même clé d'application Google : rien d'autre à configurer.
  error_email:
    name: Envoyer les erreurs par email à
    description: >-
      En cas de panne (connexion Jinka, API IDFM, Bien'ici, envoi des annonces…), un email part vers cette
      adresse (au plus un toutes les 6 h pour la même erreur), puis un autre quand c'est rétabli. Vide = désactivé.
  daily_report_email:
    name: Rapport quotidien envoyé à
    description: Chaque matin, nombre d'annonces testées et retenues par site (Jinka, Bien'ici). Vide = pas de rapport.
  daily_report_time:
    name: Heure du rapport quotidien
    description: Format HH:MM (ex. 08:00).
  smtp_server:
    name: Serveur SMTP (optionnel)
    description: Vide = deviné d'après l'adresse de la boîte dédiée (smtp.gmail.com pour Gmail).
  free_sms_user:
    name: SMS Free Mobile — identifiant
    description: Espace abonné Free Mobile → Mes options → « Notifications par SMS » (gratuit, SMS vers ton numéro).
  free_sms_key:
    name: SMS Free Mobile — clé d'identification
  whatsapp_phone:
    name: Numéro WhatsApp
    description: Format international, ex. +33612345678
  whatsapp_callmebot_apikey:
    name: Clé CallMeBot
    description: À obtenir gratuitement en suivant callmebot.com/blog/free-api-whatsapp-messages (voir la doc).
  ha_notify_service:
    name: Service de notification HA (optionnel)
    description: Ex. notify.mobile_app_iphone_de_nicolas — en plus ou à la place de WhatsApp.
  quiet_hours:
    name: Pause nocturne (pas de scan)
    description: >-
      Plage horaire sans scan, format HH:MM-HH:MM (ex. 00:00-07:00). Vide = scans jour et nuit.
      Le bouton « Scanner maintenant » marche quand même.
  peak_hours:
    name: Heures de scan rapproché
    description: Plage HH:MM-HH:MM où l'on scanne plus souvent (ex. 08:00-19:00). Vide = intervalle normal toute la journée.
  peak_interval_minutes:
    name: Intervalle pendant ces heures (min)
  scan_interval_minutes:
    name: Fréquence des scans hors heures rapprochées (min)
  max_pages_per_alert:
    name: Pages lues par alerte
  max_notifications_per_run:
    name: Notifications max par scan
  notify_existing_on_first_run:
    name: Envoyer les annonces déjà présentes au 1er scan
