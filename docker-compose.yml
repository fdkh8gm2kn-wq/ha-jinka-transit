# Test local sur le Mac : même image que dans Home Assistant.
#   cp local/options.example.json local/options.json   (puis remplis-le)
#   docker compose up --build
#   -> interface sur http://localhost:8099
services:
  jinka_transit:
    build: ./jinka_transit
    ports:
      - "8099:8099"
    volumes:
      - ./local:/data
    restart: unless-stopped
